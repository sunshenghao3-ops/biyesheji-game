<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蛇窟 · 微恐贪吃蛇</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2b1c19,#0d0c0b 70%);color:#e4d9c7;font-family:Consolas,'Microsoft YaHei',monospace}main{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #554037;padding-bottom:20px}h1{margin:5px 0;font-size:36px;letter-spacing:8px}small{color:#ad9181;letter-spacing:2px}.layout{display:grid;grid-template-columns:minmax(0,680px) 240px;gap:24px;margin-top:24px}.field{position:relative;border:5px ridge #594d41;box-shadow:0 20px 70px #0008}canvas{display:block;width:100%;image-rendering:pixelated;touch-action:none}#cover{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#100b09c9;padding:20px}#cover[hidden]{display:none}h2{font-size:32px;margin:0 0 12px}button{font:inherit;cursor:pointer;background:#71322d;border:1px solid #aa6554;color:#f1e0c9;padding:13px 20px;min-height:46px}button:hover{background:#94463b}button:focus-visible{outline:2px solid #e9b789;outline-offset:3px}.panel{border-top:1px solid #59483d;padding:20px 0}.score{font-size:46px;color:#d8a47a;display:block;margin:10px 0}p{color:#b5a193;font-size:13px;line-height:1.8}#offer{width:55px;height:55px;object-fit:contain;image-rendering:pixelated}.keys{display:flex;gap:8px;justify-content:center;margin-top:14px}.keys button{padding:12px 17px}footer{margin-top:20px;color:#927c6c;font-size:12px}.wide{width:100%;margin-top:12px}@media(max-width:720px){main{padding:16px}.layout{grid-template-columns:1fr;gap:10px}aside{display:grid;grid-template-columns:1fr 1fr;gap:16px}header small{font-size:10px}h1{font-size:29px}.score{font-size:36px}}
</style></head><body><main><header><div><small>CURSED ARCADE / 07</small><h1>蛇窟</h1></div><div><small>最高分</small><div id="best">00000</div></div></header><div class="layout"><section><div class="field"><canvas id="board" width="720" height="720" tabindex="0" aria-label="贪吃蛇游戏区"></canvas><div id="cover"><h2 id="title">地窖正在等你</h2><p id="message">吞下祭品，避开石墙和自己的身体。</p><button id="start">开始游戏</button></div></div><div class="keys"><button data-dir="up" aria-label="向上">↑</button><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></div></section><aside><div class="panel"><small>本次仪式 / SCORE</small><strong class="score" id="score">00000</strong><p id="stats">蛇节 04 · 速度 01</p><p id="ward">幽魂灯：未激活</p></div><div class="panel"><small>当前祭品</small><p><img id="offer" alt="腐烂果实"></p><strong id="foodName">腐烂果实</strong><p id="foodInfo">吞噬获得 10 分</p></div><div class="panel"><small>操控仪式</small><p>方向键 / WASD 移动<br>空格 暂停 / 继续<br>R 重新开始<br>触屏可滑动或使用方向按钮</p><button id="pause" class="wide">暂停 / 继续</button><button id="restart" class="wide">重新开始</button></div></aside></div><footer>像素素材来自你提供的图谱 · 吃到幽魂灯可抵挡一次碰撞</footer></main><script src="game.js"></script></body></html>
